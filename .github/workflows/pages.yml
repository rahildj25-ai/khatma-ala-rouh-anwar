name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Download all Warsh Mushaf page images
        run: |
          mkdir -p warsh
          for page in $(seq 1 604); do
            curl --fail --silent --show-error --location --retry 3 \
              "https://raw.githubusercontent.com/QuranHub/quran-pages-images/main/ayat/warsh/${page}.png" \
              --output "warsh/${page}.png"
          done
          test "$(find warsh -maxdepth 1 -name '*.png' | wc -l)" -eq 604
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
